<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고분자 레지스트 진공 건조 시뮬레이터</title>
  <style>
    :root { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #1f2937; }
    .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p.top { margin-top: 0; color: #4b5563; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfd8e3; border-radius: 8px; }
    button { margin-top: 14px; border: none; border-radius: 10px; padding: 10px 16px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 700; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 18px; padding: 14px; border-radius: 10px; background: #eef2ff; }
    .ok { color: #14532d; font-weight: 700; }
    .ng { color: #991b1b; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: right; font-size: 0.9rem; }
    th:first-child, td:first-child { text-align: center; }
    .hint { font-size: 0.8rem; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>고분자 레지스트 진공 건조 시뮬레이터</h1>
      <p class="top">초기 조성(고형분 28.3 wt%, PGMEA 71.7 wt%)을 기준으로, 진공 챔버 조건에서 <b>95% 이상 건조</b> 달성 가능성을 1차 근사 모델로 평가합니다.</p>

      <div class="grid">
        <div>
          <label for="totalMass">초기 총량 (g)</label>
          <input id="totalMass" type="number" value="100" min="1" step="1" />
        </div>
        <div>
          <label for="temp">챔버 온도 (°C)</label>
          <input id="temp" type="number" value="45" min="20" max="140" step="1" />
        </div>
        <div>
          <label for="pressure">챔버 압력 (mbar)</label>
          <input id="pressure" type="number" value="30" min="0.5" max="1013" step="0.5" />
        </div>
        <div>
          <label for="time">건조 시간 (min)</label>
          <input id="time" type="number" value="80" min="1" max="10000" step="1" />
        </div>
        <div>
          <label for="surface">교반/박막 계수 (1~3)</label>
          <input id="surface" type="number" value="1.2" min="0.5" max="3" step="0.1" />
        </div>
      </div>

      <button id="runBtn">시뮬레이션 실행</button>

      <div class="result" id="resultBox"></div>
      <table id="table"></table>
      <div class="hint">
        모델 가정: PGMEA 제거는 1차 소거식(dM/dt = -kM), k는 압력·온도·표면계수의 함수입니다. 실제 공정에서는 점도 상승, 막 내부 확산 제한, 장비 구조 영향으로 차이가 발생할 수 있습니다.
      </div>
    </div>
  </div>

  <script>
    const SOLID_FRAC = 0.283;
    const SOLVENT_FRAC = 0.717;
    const TARGET_DRY = 95; // solvent removal

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function estimateK(tempC, pressureMbar, surfaceFactor) {
      // Base rate at 45C, 30 mbar, factor 1.0
      const kBase = 0.030; // min^-1 (heuristic)
      const tempFactor = Math.exp((tempC - 45) / 28);
      const pressureFactor = Math.pow(30 / clamp(pressureMbar, 0.5, 1013), 0.42);
      const sf = clamp(surfaceFactor, 0.5, 3);
      return kBase * tempFactor * pressureFactor * sf;
    }

    function simulate() {
      const totalMass = Number(document.getElementById('totalMass').value);
      const temp = Number(document.getElementById('temp').value);
      const pressure = Number(document.getElementById('pressure').value);
      const time = Number(document.getElementById('time').value);
      const surface = Number(document.getElementById('surface').value);

      if ([totalMass, temp, pressure, time, surface].some(v => Number.isNaN(v) || v <= 0)) {
        document.getElementById('resultBox').innerHTML = '<span class="ng">입력값을 확인해주세요 (0보다 커야 함).</span>';
        return;
      }

      const mSolid = totalMass * SOLID_FRAC;
      const mSolv0 = totalMass * SOLVENT_FRAC;
      const k = estimateK(temp, pressure, surface);
      const mSolvFinal = mSolv0 * Math.exp(-k * time);
      const removed = mSolv0 - mSolvFinal;
      const dryPct = (removed / mSolv0) * 100;
      const finalMass = mSolid + mSolvFinal;

      const meetsTarget = dryPct >= TARGET_DRY;
      const verdict = meetsTarget
        ? '<span class="ok">건조 잘됨 가능성 높음 ✅</span>'
        : '<span class="ng">건조 미흡 가능성 있음 ⚠️</span>';

      const needTimeFor95 = Math.log(1 / (1 - TARGET_DRY / 100)) / k;

      document.getElementById('resultBox').innerHTML = `
        ${verdict}<br/>
        예상 PGMEA 제거율: <b>${dryPct.toFixed(2)}%</b><br/>
        최종 총 질량: <b>${finalMass.toFixed(2)} g</b><br/>
        목표(95%) 예상 필요 시간: <b>${needTimeFor95.toFixed(1)} min</b><br/>
        사용된 증발 속도상수 k: <b>${k.toFixed(4)} min⁻¹</b>
      `;

      const checkpoints = [0.1, 0.25, 0.5, 0.75, 1.0];
      const rows = checkpoints.map(fr => {
        const t = time * fr;
        const m = mSolv0 * Math.exp(-k * t);
        const r = (1 - m / mSolv0) * 100;
        return `<tr><td>${Math.round(fr * 100)}%</td><td>${t.toFixed(1)}</td><td>${m.toFixed(2)}</td><td>${r.toFixed(2)}</td></tr>`;
      }).join('');

      document.getElementById('table').innerHTML = `
        <thead>
          <tr><th>경과비율</th><th>시간 (min)</th><th>잔존 PGMEA (g)</th><th>누적 제거율 (%)</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      `;
    }

    document.getElementById('runBtn').addEventListener('click', simulate);
    simulate();
  </script>
</body>
</html>
